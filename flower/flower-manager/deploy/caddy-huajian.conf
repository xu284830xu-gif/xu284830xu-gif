# 花间集 · Caddy 反向代理片段
# 服务器上已经装了 Caddy（占着 80/443）时用这个，不必再装 Nginx。
#
# 用法：
#   1) 把下面的站点块追加到 /etc/caddy/Caddyfile
#   2) sudo caddy validate --config /etc/caddy/Caddyfile
#   3) sudo systemctl reload caddy
#
# 说明：
#   - flush_interval -1 关闭响应缓冲，SSE（/api/events）才能实时推送
#   - 域名方式由 Caddy 自动申请证书；香港/海外节点不需要 ICP 备案
#   - 只用 IP 时 Caddy 拿不到证书，必须显式写 http:// 前缀，否则会 308 跳 https 后握手失败

# ---------- 方式一：有域名（推荐） ----------
huajian.example.com {
    encode gzip
    reverse_proxy 127.0.0.1:8787 {
        flush_interval -1
    }
}

# ---------- 方式二：只用公网 IP、走 http ----------
# 把 47.86.12.215 换成你的公网 IP
http://47.86.12.215 {
    encode gzip
    reverse_proxy 127.0.0.1:8787 {
        flush_interval -1
    }
}

# ---------- 可选：加基本认证（应用本身无登录） ----------
# 先生成密码哈希：caddy hash-password --plaintext '你的密码'
# 然后把 user + 哈希填进 basic_auth：
#
# huajian.example.com {
#     basic_auth {
#         huajian $2a$14$xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
#     }
#     reverse_proxy 127.0.0.1:8787 {
#         flush_interval -1
#     }
# }
