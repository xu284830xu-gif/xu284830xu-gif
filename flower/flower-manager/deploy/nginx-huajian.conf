# 花间集 · Nginx 反向代理示例
# 放置：/etc/nginx/conf.d/huajian.conf
# 生效：nginx -t && systemctl reload nginx
#
# 说明：
#   - 应用监听 127.0.0.1:8787（install.sh 默认），由 Nginx 对外提供 80/443
#   - SSE（/api/events）必须关闭缓冲，否则事件会被攒着不发
#   - 同步接口单次最大 15MB，client_max_body_size 要够

upstream huajian_app {
    server 127.0.0.1:8787;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;                    # 有域名时改成 example.com

    client_max_body_size 20m;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---------- 应用 ----------
    location / {
        proxy_pass http://huajian_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # SSE / 长连接：不缓冲、不缓存、超时放宽
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # ---------- 可选：给后台加一层登录（强烈建议，应用本身无鉴权） ----------
    # 1) 生成密码文件：  printf "huajian:$(openssl passwd -apr1 '你的密码')\n" > /etc/nginx/.huajian.htpasswd
    # 2) 打开下面两行：
    # auth_basic           "Huajian Admin";
    # auth_basic_user_file /etc/nginx/.huajian.htpasswd;

    # ---------- 可选：顾客端不要求登录 ----------
    # 如果上面开了 auth_basic，用这个 location 单独放过 /shop
    # location /shop {
    #     auth_basic off;
    #     proxy_pass http://huajian_app;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }

    access_log /var/log/nginx/huajian.access.log;
    error_log  /var/log/nginx/huajian.error.log warn;
}

# =========================================================
#  有域名 + HTTPS 时，用 certbot 自动生成下面这段（不要手写）：
#    apt install -y certbot python3-certbot-nginx
#    certbot --nginx -d example.com
#  生成后 listen 443 ssl 的 server 块里同样需要上面的 proxy_* 与 proxy_buffering off。
# =========================================================
