}

function badgeForStock(flower) {
  const s = stockStatus(flower);
  return `<span class="badge ${s.badge}">${s.label}</span>`;
}

function segmentedHTML(options, active, action) {
  return `<div class="segmented" role="group" aria-label="时间范围">
    ${options.map((opt) => `<button class="seg-btn ${String(active) === String(opt.value) ? 'is-active' : ''}" data-action="${action}" data-value="${opt.value}">${escapeHTML(opt.label)}</button>`).join('')}
  </div>`;
}

/* ---------------- 图表 ---------------- */
function niceMax(value) {
  const n = Number(value) || 0;
  if (n <= 0) return 100;
  const exponent = Math.floor(Math.log10(n));
  const fraction = n / (10 ** exponent);
  let nice;
  if (fraction <= 1) nice = 1;
  else if (fraction <= 2) nice = 2;
  else if (fraction <= 2.5) nice = 2.5;
  else if (fraction <= 5) nice = 5;
  else nice = 10;
  return nice * (10 ** exponent);
}

function smoothPath(points) {
  if (!points.length) return '';
  if (points.length === 1) return `M${points[0].x},${points[0].y}`;
  let d = `M${points[0].x},${points[0].y}`;
  for (let i = 0; i < points.length - 1; i += 1) {
    const p0 = points[i - 1] || points[i];
    const p1 = points[i];
    const p2 = points[i + 1];
    const p3 = points[i + 2] || p2;
    const cp1x = p1.x + (p2.x - p0.x) / 6;
    const cp1y = p1.y + (p2.y - p0.y) / 6;
    const cp2x = p2.x - (p3.x - p1.x) / 6;
    const cp2y = p2.y - (p3.y - p1.y) / 6;
    d += ` C${cp1x.toFixed(2)},${cp1y.toFixed(2)} ${cp2x.toFixed(2)},${cp2y.toFixed(2)} ${p2.x.toFixed(2)},${p2.y.toFixed(2)}`;
  }
  return d;
}

function buildLineChart(series, { height = 252, showProfit = true } = {}) {
  const width = 760;
  const pad = { top: 18, right: 16, bottom: 30, left: 52 };
  const innerW = width - pad.left - pad.right;
  const innerH = height - pad.top - pad.bottom;
  const maxValue = Math.max(100, ...series.map((s) => s.revenue), ...series.map((s) => s.profit));
  const yMax = niceMax(maxValue * 1.16);
  const xFor = (i) => pad.left + (series.length <= 1 ? innerW / 2 : (innerW * i) / (series.length - 1));
  const yFor = (v) => pad.top + innerH - (clamp(v, 0, yMax) / yMax) * innerH;
  const pointsRevenue = series.map((s, i) => ({ x: xFor(i), y: yFor(s.revenue), data: s }));
  const pointsProfit = series.map((s, i) => ({ x: xFor(i), y: yFor(s.profit), data: s }));

  let grid = '';
  for (let i = 0; i <= 4; i += 1) {
    const y = pad.top + (innerH * i) / 4;
    const value = yMax * (1 - i / 4);
    grid += `<line class="grid-line" x1="${pad.left}" y1="${y.toFixed(1)}" x2="${width - pad.right}" y2="${y.toFixed(1)}"/>`;
    grid += `<text class="axis-label" x="${pad.left - 8}" y="${(y + 3).toFixed(1)}" text-anchor="end">${moneyCompact(value)}</text>`;
  }

  const labelIndexes = new Set();
  if (series.length <= 7) {
    series.forEach((_, i) => labelIndexes.add(i));
  } else {
    [0, Math.round((series.length - 1) / 3), Math.round(((series.length - 1) * 2) / 3), series.length - 1].forEach((i) => labelIndexes.add(i));
  }
  let xLabels = '';
  labelIndexes.forEach((i) => {
    const s = series[i];
    if (!s) return;
    xLabels += `<text class="axis-label" x="${xFor(i)}" y="${height - 8}" text-anchor="middle">${s.label}</text>`;
  });

  const revenuePath = smoothPath(pointsRevenue);
  const profitPath = smoothPath(pointsProfit);
  const areaPath = `${revenuePath} L${pointsRevenue[pointsRevenue.length - 1]?.x || pad.left},${pad.top + innerH} L${pointsRevenue[0]?.x || pad.left},${pad.top + innerH} Z`;

  let dots = '';
  pointsRevenue.forEach((p, i) => {
    const show = series.length <= 7 || i === 0 || i === series.length - 1 || i % 5 === 0;
    if (!show) return;
    dots += `<circle class="point" cx="${p.x}" cy="${p.y}" r="3.1" fill="#1f5848"><title>${escapeHTML(p.data.key)} · 营收 ${money(p.data.revenue)} · 毛利 ${money(p.data.profit)}</title></circle>`;
  });

  return `<svg class="chart-svg" viewBox="0 0 ${width} ${height}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="营收与毛利趋势图">
    <defs>
      <linearGradient id="revenueFill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#5d8e74" stop-opacity=".2"/>
        <stop offset="72%" stop-color="#8daf9c" stop-opacity=".055"/>
        <stop offset="100%" stop-color="#fffdf8" stop-opacity="0"/>
      </linearGradient>
    </defs>
    ${grid}
    ${xLabels}
    <path d="${areaPath}" fill="url(#revenueFill)"/>
    <path d="${revenuePath}" fill="none" stroke="#1f5848" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    ${showProfit ? `<path d="${profitPath}" fill="none" stroke="#a7c0ac" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 0"/>` : ''}
    ${dots}
    <circle cx="${pointsRevenue[pointsRevenue.length - 1]?.x}" cy="${pointsRevenue[pointsRevenue.length - 1]?.y}" r="5.2" fill="#1f5848" opacity=".12"/>
    <circle cx="${pointsRevenue[pointsRevenue.length - 1]?.x}" cy="${pointsRevenue[pointsRevenue.length - 1]?.y}" r="3.2" fill="#fffdf8" stroke="#1f5848" stroke-width="2"/>
  </svg>`;
}

function buildPriceChart(flower) {
  if (!flower) return '';
  const width = 760;
  const height = 238;
  const pad = { top: 18, right: 18, bottom: 31, left: 52 };
  const innerW = width - pad.left - pad.right;
  const innerH = height - pad.top - pad.bottom;
  const history = state.priceHistory
    .filter((p) => p.flowerId === flower.id)
    .sort((a, b) => new Date(a.date) - new Date(b.date));
  const startDate = toDate(flower.createdAt || new Date());
  const points = [];

  const baselinePrice = history.length ? history[0].oldPrice : flower.price;
  const baselineCost = history.length ? history[0].oldCost : flower.cost;
  points.push({ date: startDate, price: baselinePrice, cost: baselineCost });

  history.forEach((event) => {
    points.push({ date: toDate(event.date), price: event.newPrice, cost: event.newCost });
  });
  const last = points[points.length - 1];
  if (!last || last.date.getTime() < Date.now() - 3600000) {
    points.push({ date: new Date(), price: flower.price, cost: flower.cost });
  }

  const minTime = Math.min(...points.map((p) => p.date.getTime()));
  const maxTime = Math.max(...points.map((p) => p.date.getTime()), minTime + 86400000);
  const maxValue = Math.max(10, ...points.map((p) => p.price), ...points.map((p) => p.cost));
  const minValue = Math.min(...points.map((p) => p.price), ...points.map((p) => p.cost));
  const yMin = Math.max(0, Math.floor((minValue * 0.78) / 5) * 5);
  const yMax = Math.max(niceMax(maxValue * 1.08), yMin + 5);
  const xFor = (date) => pad.left + ((date.getTime() - minTime) / Math.max(1, maxTime - minTime)) * innerW;
  const yFor = (v) => pad.top + innerH - ((clamp(v, yMin, yMax) - yMin) / Math.max(1, yMax - yMin)) * innerH;
  const pricePoints = points.map((p) => ({ x: xFor(p.date), y: yFor(p.price), data: p }));
  const costPoints = points.map((p) => ({ x: xFor(p.date), y: yFor(p.cost), data: p }));

  let grid = '';
  for (let i = 0; i <= 4; i += 1) {
    const y = pad.top + (innerH * i) / 4;
    const value = yMax - ((yMax - yMin) * i) / 4;
    const labelValue = value >= 1000
      ? `¥${(value / 1000).toFixed(1)}k`
      : `¥${Number.isInteger(Math.round(value * 10) / 10) ? Math.round(value) : value.toFixed(1)}`;
    grid += `<line class="grid-line" x1="${pad.left}" y1="${y.toFixed(1)}" x2="${width - pad.right}" y2="${y.toFixed(1)}"/>`;
    grid += `<text class="axis-label" x="${pad.left - 8}" y="${(y + 3).toFixed(1)}" text-anchor="end">${labelValue}</text>`;
  }

  const midTime = minTime + (maxTime - minTime) / 2;
  const xLabelDates = [new Date(minTime), new Date(midTime), new Date(maxTime)];
  const xLabels = xLabelDates.map((date, i) => `<text class="axis-label" x="${xFor(date)}" y="${height - 8}" text-anchor="${i === 0 ? 'start' : i === 2 ? 'end' : 'middle'}">${formatDate(date, 'short')}</text>`).join('');

  const pricePath = smoothPath(pricePoints);
  const costPath = smoothPath(costPoints);
  const areaPath = `${pricePath} L${pricePoints[pricePoints.length - 1]?.x || pad.left},${pad.top + innerH} L${pricePoints[0]?.x || pad.left},${pad.top + innerH} Z`;

  const dots = pricePoints.map((p) => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3" fill="#1f5848" stroke="#fffdf8" stroke-width="2"><title>${formatDate(p.data.date, 'dot')} · 售价 ${money(p.data.price)} · 成本 ${money(p.data.cost)}</title></circle>`).join('');

  return `<svg class="chart-svg" viewBox="0 0 ${width} ${height}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="售价与成本走势图">
    <defs>
      <linearGradient id="priceFill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#4f8068" stop-opacity=".17"/>
        <stop offset="100%" stop-color="#fffdf8" stop-opacity="0"/>
      </linearGradient>
    </defs>
    ${grid}
    ${xLabels}
    <path d="${areaPath}" fill="url(#priceFill)"/>
    <path d="${pricePath}" fill="none" stroke="#1f5848" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="${costPath}" fill="none" stroke="#c49a5a" stroke-width="1.7" stroke-dasharray="5 5" stroke-linecap="round"/>
    ${dots}
  </svg>`;
}

function donutGradient(items, total) {
  if (!total) return 'conic-gradient(#e8e5db 0deg 360deg)';
  let cursor = 0;
  const parts = items.map((item, i) => {
    const start = cursor;
    cursor += (item.value / total) * 360;
    return `${CATEGORY_COLORS[i % CATEGORY_COLORS.length]} ${start.toFixed(2)}deg ${cursor.toFixed(2)}deg`;
  });
  if (cursor < 359.99) parts.push(`#e8e5db ${cursor.toFixed(2)}deg 360deg`);
  return `conic-gradient(${parts.join(', ')})`;
}

function collapseCategories(items, limit = 5) {
  if (items.length <= limit) return items;
  const head = items.slice(0, limit - 1);
  const rest = round2(items.slice(limit - 1).reduce((sum, item) => sum + item.value, 0));
  return [...head, { name: '其他', value: rest }];
}

/* ---------------- 经营总览 ---------------- */
function buildDashboardAlerts() {
  const list = activeFlowers();
  const low = list.filter((f) => f.stock <= f.minStock);
  const slow = list.filter((f) => f.stock > 0 && shelfDays(f) >= 7);
  const thin = list.filter((f) => f.price > 0 && grossMargin(f.price, f.cost) < 0.22);
  const alerts = [];
  if (low.length) {
    alerts.push({
      tone: 'red',
      iconName: 'alert',
      title: `${low.length} 种花低于安全库存`,
      desc: `${low.slice(0, 2).map((f) => f.name).join('、')}${low.length > 2 ? '等' : ''} · 建议及时补货`,
      action: 'goto-inventory',
      filter: 'low'
    });
  }
  if (slow.length) {
    alerts.push({
      tone: 'gold',
      iconName: 'clock',
      title: `${slow.length} 种花需要关注库龄`,
      desc: `${slow.slice(0, 2).map((f) => f.name).join('、')}${slow.length > 2 ? '等' : ''} · 到店已超过 7 天`,
      action: 'goto-inventory',
      filter: 'slow'
    });
  }
  if (thin.length) {
    alerts.push({
      tone: 'blue',
      iconName: 'tag',
      title: `${thin.length} 种花毛利偏薄`,
      desc: `${thin.slice(0, 2).map((f) => f.name).join('、')} · 建议检查定价或成本`,
      action: 'nav',
      view: 'pricing'
    });
  }
  if (!alerts.length) {
    alerts.push({
      tone: 'green',
      iconName: 'check-circle',
      title: '库存与毛利状态健康',
      desc: '暂无需处理的经营提醒，保持这个节奏。',
      action: 'goto-inventory',
      filter: 'all'
    });
  }
  return alerts;
}

function renderDashboardView() {
  const now = new Date();
  const month = monthOrders(0);
  const prevMonth = monthOrders(-1);
  const monthSummary = summarizeOrders(month);
  const prevSummary = summarizeOrders(prevMonth);
  const inventory = inventorySummary();
  const today = summarizeOrders(todayOrders());
  const replenish = replenishmentList(1);
  const monthMargin = monthSummary.revenue > 0 ? monthSummary.profit / monthSummary.revenue : 0;
  const alerts = buildDashboardAlerts();
  const chartRange = ui.chartRange === 30 ? 30 : 7;
  const series = salesSeries(chartRange);
  const rangeSummary = summarizeOrders(ordersInRange(String(chartRange)));
  const categoryItems = collapseCategories(inventoryByCategory(), 5);
  const categoryTotal = categoryItems.reduce((sum, item) => sum + item.value, 0);

  const briefText = today.count
    ? `今天已完成 <b>${today.count}</b> 笔订单，实收 <b>${money(today.revenue)}</b>。${inventory.lowCount ? `有 <b>${inventory.lowCount}</b> 种花低于安全库存。` : '库存水位平稳。'}`
    : `今天还没有开单。${replenish.length ? `「${escapeHTML(replenish[0].flower.name)}」按近期销量建议补 ${replenish[0].plan.suggested} ${escapeHTML(replenish[0].flower.unit)}。` : '可以先整理花材、更新今日售价。'}`;

  const alertHTML = alerts.map((alert) => `
    <button class="alert-row" data-action="${alert.action}" ${alert.filter ? `data-filter="${alert.filter}"` : ''} ${alert.view ? `data-view="${alert.view}"` : ''}>
      <span class="alert-symbol tone-${alert.tone}">${icon(alert.iconName, 15)}</span>
      <span class="alert-copy">
        <span class="alert-title">${escapeHTML(alert.title)}</span>
        <span class="alert-desc">${escapeHTML(alert.desc)}</span>
      </span>
      <span class="alert-arrow">${icon('chevron-right', 13)}</span>
    </button>`).join('');

  const stockRows = [...activeFlowers()]
    .sort((a, b) => stockPercent(a) - stockPercent(b))
    .slice(0, 5)
    .map((flower) => {
      const status = stockStatus(flower);
      const fresh = freshness(flower);
      return `<button class="stock-row" data-action="view-flower" data-id="${flower.id}">
        <span class="stock-flower">
          ${flowerAvatar(flower)}
          <span class="stock-copy">
            <span class="stock-name">${escapeHTML(flower.name)}</span>
            <span class="stock-sub">${escapeHTML(flower.category)} · ${escapeHTML(flower.variety || flower.color || '常规品种')}</span>
          </span>
        </span>
        <span class="stock-qty">
          <strong>${number(flower.stock)} <small>${escapeHTML(flower.unit)}</small></strong>
          <small>安全库存 ${number(flower.minStock)}</small>
        </span>
        <span class="stock-bar-wrap">
          <span class="stock-bar"><i class="${status.bar}" style="width:${stockPercent(flower)}%"></i></span>
          <small>${fresh.label} · ${fresh.days} 天</small>
        </span>
        <span class="stock-value">
          <strong>${money(flower.stock * flower.cost)}</strong>
          <small>库存成本</small>
        </span>
      </button>`;
    }).join('');

  const categoryLegend = categoryItems.map((item, i) => `
    <div class="category-item">
      <span class="category-dot" style="background:${CATEGORY_COLORS[i % CATEGORY_COLORS.length]}"></span>
      <span class="category-name">${escapeHTML(item.name)}</span>
      <span class="category-share">${categoryTotal ? Math.round((item.value / categoryTotal) * 100) : 0}%</span>
    </div>`).join('');

  return `
    <div class="dashboard-head">
      <div class="page-head">
        <div class="page-head-copy">
          <div class="eyebrow">DAILY OVERVIEW · ${formatDate(now, 'dot')}</div>
          <h1>${greeting()}，${escapeHTML(state.settings.owner || '花掌柜')}</h1>
          <p>${escapeHTML(state.settings.shopName)}的今日花事与经营数据，都在这里。</p>
        </div>
      </div>
      <div class="dashboard-ornament">
        <span class="ornament-line"></span>
        <span>把日子过成一束花</span>

/* ---------------- 库存管理 ---------------- */
function filteredFlowers() {
  let list = activeFlowers();
  const search = ui.invSearch.trim().toLowerCase();
  if (search) {
    list = list.filter((f) => [f.name, f.variety, f.category, f.color, f.supplier, f.location, f.note]
      .join(' ').toLowerCase().includes(search));
  }
  if (ui.invCategory !== 'all') list = list.filter((f) => f.category === ui.invCategory);
  if (ui.invStatus === 'low') list = list.filter((f) => f.stock <= f.minStock);
  else if (ui.invStatus === 'healthy') list = list.filter((f) => f.stock > f.minStock);
  else if (ui.invStatus === 'slow') list = list.filter((f) => f.stock > 0 && shelfDays(f) >= 7);
  else if (ui.invStatus === 'empty') list = list.filter((f) => f.stock <= 0);

  switch (ui.invSort) {
    case 'stockAsc': list.sort((a, b) => a.stock - b.stock); break;
    case 'stockDesc': list.sort((a, b) => b.stock - a.stock); break;
    case 'priceDesc': list.sort((a, b) => b.price - a.price); break;
    case 'marginAsc': list.sort((a, b) => grossMargin(a.price, a.cost) - grossMargin(b.price, b.cost)); break;
    case 'newest': list.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)); break;
    case 'name': list.sort((a, b) => a.name.localeCompare(b.name, 'zh-CN')); break;
    default: list.sort((a, b) => stockPercent(a) - stockPercent(b));
  }
  return list;
}

function cartDetails() {
  return ui.cart.map((item) => {
    const flower = getFlower(item.flowerId);
    if (!flower) return null;
    const qty = clamp(Math.round(item.qty || 1), 1, Math.max(1, flower.stock));
    const unitPrice = round2(Math.max(0, item.unitPrice || 0));
    return {
      flower,
      qty,
      unitPrice,
      subtotal: round2(qty * unitPrice),
      cost: round2(qty * flower.cost)
    };
  }).filter(Boolean);
}

function cartSummary() {
  const details = cartDetails();
  const subtotal = round2(details.reduce((sum, item) => sum + item.subtotal, 0));
  const cost = round2(details.reduce((sum, item) => sum + item.cost, 0));
  return {
    details,
    count: details.reduce((sum, item) => sum + item.qty, 0),
    subtotal,
    cost,
    profit: round2(subtotal - cost)
  };
}

function filteredOrders() {
  let list = [...state.orders];
  const search = ui.recordSearch.trim().toLowerCase();
  if (search) {
    list = list.filter((o) => {
      const text = [o.no, o.customer, o.note, o.payment, ...o.lines.map((l) => `${l.name} ${l.variety}`)].join(' ').toLowerCase();
      return text.includes(search);
    });
  }
  if (ui.recordPayment !== 'all') list = list.filter((o) => o.payment === ui.recordPayment);
  list = list.filter((o) => isWithinRange(o.date, ui.recordRange));
  return list.sort((a, b) => new Date(b.date) - new Date(a.date));
}

function financeInsightsHTML(products, customers, loss, revenue) {
  const insights = [];
  const top = products[0];
  if (top) {
    insights.push({
      iconName: 'trend-up',
      tone: 'green',
      title: `最会赚钱的花：${top.name}`,
      desc: `贡献 ${money(top.revenue)} 营收、${money(top.profit)} 毛利，售出 ${number(top.units)} ${escapeHTML(top.unit)}。`
    });
  }
  const thin = products.find((p) => p.revenue > 0 && p.profit / p.revenue < 0.25);
  if (thin) {
    insights.push({
      iconName: 'tag',
      tone: 'gold',
      title: '留意低毛利商品',
      desc: `${escapeHTML(thin.name)} 的毛利率仅 ${percent(thin.profit / thin.revenue, 1)}，可以尝试调整售价或更换进货渠道。`
    });
  }
  if (loss > 0) {
    const rate = lossRate(revenue, loss);
    insights.push({
      iconName: 'alert',
      tone: 'red',
      title: '损耗正在吃掉利润',
      desc: `当前损耗成本 ${money(loss)}，占营收 ${percent(rate, 1)}。优先处理库龄较长的花材。`
    });
  }
  if (customers[0]) {
    insights.push({
      iconName: 'users',
      tone: 'green',
      title: `最稳定客户：${customers[0].name}`,
      desc: `贡献 ${money(customers[0].revenue)}，共 ${customers[0].orders} 笔订单，最近一次 ${formatDate(customers[0].last)}。`
    });
  }
  if (!insights.length) {
    insights.push({
      iconName: 'sparkles',
      tone: 'green',
      title: '等第一笔订单',
      desc: '完成开单后，这里会自动给出商品、客户和损耗方面的经营提示。'
    });
  }
  return insights.map((item) => `<div class="insight-item">
    <span class="insight-icon ${item.tone === 'green' ? 'is-green' : item.tone === 'red' ? 'is-red' : ''}">${icon(item.iconName, 12)}</span>
    <span class="insight-copy"><strong>${escapeHTML(item.title)}</strong><span>${item.desc}</span></span>
  </div>`).join('');
}

function priceHistoryForFlower(flowerId) {
  return state.priceHistory
    .filter((p) => p.flowerId === flowerId)
    .sort((a, b) => new Date(b.date) - new Date(a.date));
}

function pricingHealth(flower) {
  const margin = grossMargin(flower.price, flower.cost);
  if (flower.price <= 0) return { level: 'bad', text: '当前未设置售价，建议先完成定价。' };
  if (margin < 0.2) return { level: 'bad', text: `毛利率 ${percent(margin, 1)}，空间较薄。建议将售价调整至 ${money(suggestedPrice(flower.cost, 0.35))} 左右。` };
  if (margin < 0.35) return { level: 'warn', text: `毛利率 ${percent(margin, 1)}，略低于健康区间。可结合花材品质尝试小幅提价。` };
  if (margin > 0.68) return { level: 'warn', text: `毛利率 ${percent(margin, 1)} 偏高，若动销放缓，可以考虑做组合花束提升性价比。` };
  return { level: 'good', text: `毛利率 ${percent(margin, 1)}，处于健康区间。保持关注同类花材的市场价格即可。` };
}

function renderPricingView() {
  const active = activeFlowers();
  if (!active.length) {
    return `${pageHeadHTML({ eyebrow: 'PRICING · 售价与成本', title: VIEW_META.pricing.title, description: '管理售价、成本与调价记录。', actions: '' })}

  }
  if (!active.some((f) => f.id === ui.priceFlowerId)) ui.priceFlowerId = active[0].id;
  const flower = getFlower(ui.priceFlowerId) || active[0];
  const history = priceHistoryForFlower(flower.id);
  const health = pricingHealth(flower);
  const margin = grossMargin(flower.price, flower.cost);
  const recentCount = state.priceHistory.filter((p) => p.flowerId === flower.id && isWithinRange(p.date, '30')).length;

  const avgPrice = active.reduce((sum, f) => sum + f.price, 0) / active.length;
  const avgCost = active.reduce((sum, f) => sum + f.cost, 0) / active.length;
  const avgMargin = active.reduce((sum, f) => sum + grossMargin(f.price, f.cost), 0) / active.length;
  const changes30 = state.priceHistory.filter((p) => isWithinRange(p.date, '30')).length;

  const allHistory = [...state.priceHistory]
    .sort((a, b) => new Date(b.date) - new Date(a.date))
    .slice(0, 15);
  const historyRows = allHistory.map((entry) => {
    const f = getFlower(entry.flowerId);
    const pct = priceChangePercent(entry.oldPrice, entry.newPrice);
    const cls = pct > 0 ? 'change-up' : pct < 0 ? 'change-down' : 'change-flat';
    const arrow = pct > 0 ? '↑' : pct < 0 ? '↓' : '→';
    return `<tr>
      <td><span class="order-date">${formatDate(entry.date)}</span><span class="flower-meta">${formatTime(entry.date)}</span></td>
      <td>${f ? `<div class="flower-cell">${flowerAvatar(f, 'is-sm')}<span class="flower-cell-copy"><span class="flower-name" style="cursor:default">${escapeHTML(f.name)}</span><span class="flower-meta">${escapeHTML(f.category)}</span></span></div>` : '已删除花卉'}</td>
      <td>${money(entry.oldPrice)}</td>
      <td><strong>${money(entry.newPrice)}</strong></td>
      <td><span class="${cls}">${arrow} ${percent(Math.abs(pct), 1)}</span></td>
      <td><span class="flower-meta">${money(entry.oldCost)} → ${money(entry.newCost)}</span></td>
      <td><span class="order-lines-preview">${escapeHTML(entry.reason || '调整售价')}</span></td>
    </tr>`;
  }).join('');

  return `
    ${pageHeadHTML({
      eyebrow: 'PRICING · 售价与成本',
      title: VIEW_META.pricing.title,
      description: '记录每一次价格浮动，比较售价与成本，找到既好卖又有利润的定价区间。',
      actions: `<button class="btn btn-ghost" data-action="adjust-stock" data-id="${flower.id}">${icon('box', 16)} 补货更新成本</button>
        <button class="btn btn-primary" data-action="change-price" data-id="${flower.id}">${icon('tag', 16)} 调整价格</button>`
    })}

    <div class="price-metric-row">
      <div class="price-metric"><span>平均售价</span><strong>${money(avgPrice)}</strong><small>${active.length} 种在售花卉</small></div>
      <div class="price-metric"><span>平均成本</span><strong>${money(avgCost)}</strong><small>按当前单位成本</small></div>
      <div class="price-metric"><span>平均毛利率</span><strong>${percent(avgMargin, 1)}</strong><small>简单算术平均</small></div>
      <div class="price-metric"><span>近 30 天调价</span><strong>${changes30} 次</strong><small>所有花卉合计</small></div>
    </div>

    <div class="pricing-layout">
      <section class="card pricing-main">
        <div class="section-head">
          <div>
            <h2>售价与成本走势</h2>
            <p>${escapeHTML(flower.name)} · 共 ${history.length} 次调价记录</p>
          </div>
          <select class="select select-sm" id="priceFlowerSelect" aria-label="选择花卉">
            ${active.map((f) => `<option value="${f.id}" ${f.id === flower.id ? 'selected' : ''}>${escapeHTML(f.name)}</option>`).join('')}
          </select>
        </div>
        <div class="chart-summary">
          <span class="chart-total"><span class="currency">¥</span>${money(flower.price, false)}</span>
          <span class="chart-compare">当前售价 · 成本 ${money(flower.cost)}</span>
        </div>
        <div class="chart-shell">${buildPriceChart(flower)}</div>
        <div class="price-chart-legend">
          <span class="legend-item"><i class="legend-swatch"></i>售价</span>
          <span class="legend-item"><i class="legend-swatch is-dash"></i>成本</span>
          <span class="muted" style="margin-left:auto">时间范围为建档至今</span>
        </div>
      </section>

      <div class="pricing-side">
        <section class="card price-now">
          <div class="price-now-head">
            ${flowerAvatar(flower)}
            <div class="price-now-title">
              <strong>${escapeHTML(flower.name)}</strong>
              <span>${escapeHTML(flower.category)} · ${escapeHTML(flower.variety || flower.color || '常规')} · ${escapeHTML(flower.grade)} 级</span>
            </div>
          </div>
          <div class="price-big">
            <strong>${money(flower.price)}</strong>
            <span>/ ${escapeHTML(flower.unit)}</span>
            <span class="badge ${margin < 0.2 ? 'badge-red' : margin < 0.35 ? 'badge-gold' : 'badge-green'}">${percent(margin, 0)}</span>
          </div>
          <div class="price-rows">
            <div class="price-row"><span>单位成本</span><strong>${money(flower.cost)}</strong></div>
            <div class="price-row"><span>建议售价（35% 毛利）</span><strong>${money(suggestedPrice(flower.cost, 0.35))}</strong></div>
            <div class="price-row"><span>当前库存</span><strong>${number(flower.stock)} ${escapeHTML(flower.unit)}</strong></div>
            <div class="price-row"><span>近 30 天调价</span><strong>${recentCount} 次</strong></div>
          </div>
          <div class="price-health ${health.level === 'warn' ? 'is-warn' : health.level === 'bad' ? 'is-bad' : ''}">${health.text}</div>
          <div class="price-actions">
            <button class="btn btn-soft btn-sm" data-action="adjust-stock" data-id="${flower.id}">${icon('box', 14)} 补货</button>
            <button class="btn btn-primary btn-sm" data-action="change-price" data-id="${flower.id}">${icon('tag', 14)} 改价</button>
          </div>
        </section>

        <section class="card" style="padding:16px 18px">
          <div class="section-head"><div><h2 style="font-size:14px">毛利小贴士</h2><p>用成本倒推合理售价</p></div></div>
          <div style="margin-top:12px;display:flex;flex-direction:column;gap:8px">
            ${[0.3, 0.4, 0.5].map((target) => `<div class="price-row" style="padding:7px 0;border-top:1px solid #f0ede4">
              <span>目标毛利 ${percent(target, 0)}</span><strong>${money(suggestedPrice(flower.cost, target))}</strong>
            </div>`).join('')}
          </div>
          <p class="field hint" style="margin-top:9px">售价 = 成本 ÷ (1 − 目标毛利率)</p>
        </section>
      </div>
    </div>

    <section class="card table-card">
      <div class="table-card-head">
        <div><h2>调价记录</h2><p>最近 15 条价格与成本变动，方便回溯定价决策。</p></div>
        <span class="count-chip">${state.priceHistory.length} 条记录</span>
      </div>
      ${allHistory.length ? `<div class="table-wrap">
        <table class="data-table" style="min-width:900px">
          <thead><tr><th>时间</th><th>花卉</th><th>原售价</th><th>新售价</th><th>幅度</th><th>成本变化</th><th>原因</th></tr></thead>
          <tbody>${historyRows}</tbody>
        </table>
      </div>` : emptyStateHTML({ title: '还没有调价记录', description: '通过改价或补货更新成本后，这里会保留完整的价格浮动历史。', action: `<button class="btn btn-primary btn-sm" data-action="change-price" data-id="${flower.id}">调整价格</button>`, iconName: 'tag' })}
    </section>`;
}

</script>
<script>
/* =========================================================
   花间集 · 交互与应用逻辑
   ========================================================= */
'use strict';

let state = loadState();

const ui = {
  view: 'dashboard',
  chartRange: 7,
  invSearch: '',
  invCategory: 'all',
  invStatus: 'all',
  invSort: 'default',
  saleSearch: '',
  saleCategory: 'all',
  cart: [],
  recordSearch: '',
  recordRange: '30',
  recordPayment: 'all',
  financeRange: '30',
  priceFlowerId: null
};

let pendingConfirm = null;
let lastFocused = null;

/* ---------------- 启动 ---------------- */
function init() {
  hydrateStaticIcons();
  updateShell();
  updateSaveIndicator({ ok: true, at: new Date() }, true);
  render();
  bindEvents();
}

function hydrateStaticIcons() {
  document.querySelectorAll('[data-icon]').forEach((el) => {
    el.innerHTML = icon(el.dataset.icon, 19);
  });
}

function updateShell() {
  const brand = document.getElementById('brandName');
  if (brand) brand.textContent = state.settings.shopName || '我的花店';
  document.title = `${state.settings.shopName || '我的花店'} · 花卉经营管理`;

  const topbarKicker = document.getElementById('topbarKicker');
  if (topbarKicker) topbarKicker.textContent = VIEW_META[ui.view]?.kicker || '经营总览';
  const topbarDate = document.getElementById('topbarDate');
  if (topbarDate) topbarDate.textContent = `${formatDate(new Date(), 'full')} · ${weekdayName()}`;

  const lowCount = activeFlowers().filter((f) => f.stock <= f.minStock).length;
  const navLow = document.getElementById('navLowCount');
  if (navLow) {
    navLow.textContent = String(lowCount);
    navLow.hidden = lowCount === 0;
  }

  document.querySelectorAll('.nav-item[data-view]').forEach((el) => {
    el.classList.toggle('is-active', el.dataset.view === ui.view);
  });
}

function render() {
  if (ui.view === 'sales') pruneCart();
  const root = document.getElementById('viewRoot');
  if (!root) return;
  root.innerHTML = renderView(ui.view);
  root.classList.remove('view-enter');
  void root.offsetWidth;
  root.classList.add('view-enter');
  updateShell();
}

function navigate(view) {
  if (!VIEW_META[view]) return;
  if (!document.getElementById('modalLayer').hidden) closeModal();
  ui.view = view;
  closeSidebar();
  if (view === 'sales') pruneCart();
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ---------------- 保存与提示 ---------------- */
function updateSaveIndicator(result, initial = false) {
  const el = document.getElementById('saveIndicator');
  if (!el) return;
  const ok = result?.ok !== false;
  el.classList.toggle('is-saving', !ok);
  if (!ok) {
    el.innerHTML = `<i></i><span>保存失败</span>`;
    return;
  }
  const time = result?.at ? formatTime(result.at) : formatTime(new Date());
  el.innerHTML = `<i></i><span>${initial ? '本地已保存' : `已保存 ${time}`}</span>`;
}

function commit() {
  const result = saveState(state);
  updateSaveIndicator(result);
  if (!result.ok) showToast('本地保存失败，请检查浏览器存储权限。', 'error');
  render();
}

function showToast(message, type = 'success') {
  const stack = document.getElementById('toastStack');
  if (!stack) return;
  const toast = document.createElement('div');
  toast.className = `toast ${type === 'error' ? 'is-error' : type === 'info' ? 'is-info' : ''}`;
  const iconName = type === 'error' ? 'alert' : type === 'info' ? 'info' : 'check-circle';
  toast.innerHTML = `${icon(iconName, 15)}<span>${escapeHTML(message)}</span>`;
  stack.appendChild(toast);
  window.setTimeout(() => {
    toast.classList.add('is-leaving');
    window.setTimeout(() => toast.remove(), 220);
  }, 3300);
}

/* ---------------- 侧边栏 ---------------- */
function openSidebar() {
  const sidebar = document.getElementById('sidebar');
  const scrim = document.querySelector('.sidebar-scrim');
  if (sidebar) sidebar.classList.add('is-open');
  if (scrim) scrim.classList.add('is-visible');
}

function closeSidebar() {
  const sidebar = document.getElementById('sidebar');
  const scrim = document.querySelector('.sidebar-scrim');
  if (sidebar) sidebar.classList.remove('is-open');
  if (scrim) scrim.classList.remove('is-visible');
}

/* ---------------- 购物车 ---------------- */
function pruneCart() {
  ui.cart = ui.cart.map((item) => {
    const flower = getFlower(item.flowerId);
    if (!flower || flower.active === false || flower.stock <= 0) return null;
    return {
      flowerId: item.flowerId,
      qty: clamp(Math.round(item.qty || 1), 1, flower.stock),
      unitPrice: round2(Math.max(0, item.unitPrice ?? flower.price))
    };
  }).filter(Boolean);
}

function addToCart(id) {
  const flower = getFlower(id);
  if (!flower || flower.active === false) {
    showToast('这枝花已经下架了。', 'error');
    return;
  }
  if (flower.stock <= 0) {
    showToast(`${flower.name} 已售罄，暂时无法开单。`, 'error');
    return;
  }
  const existing = ui.cart.find((item) => item.flowerId === id);
  if (existing) {
    if (existing.qty >= flower.stock) {
      showToast(`库存只剩 ${flower.stock} ${flower.unit}，不能再加了。`, 'info');
      return;
    }
    existing.qty += 1;
  } else {
    ui.cart.push({ flowerId: id, qty: 1, unitPrice: flower.price });
  }
  if (ui.view !== 'sales') ui.view = 'sales';
  if (!document.getElementById('modalLayer').hidden) closeModal();
  render();
  showToast(`${flower.name} 已加入清单。`);
}

function changeCartQty(id, delta) {
  const flower = getFlower(id);
  const item = ui.cart.find((entry) => entry.flowerId === id);
  if (!flower || !item) return;
  if (delta > 0 && item.qty >= flower.stock) {
    showToast(`库存只剩 ${flower.stock} ${flower.unit}。`, 'info');
    return;
  }
  item.qty = clamp(item.qty + delta, 1, flower.stock);
  render();
}

function removeCartItem(id) {
  ui.cart = ui.cart.filter((item) => item.flowerId !== id);
  render();
}

function syncCartFromInputs() {
  document.querySelectorAll('[data-cart-qty]').forEach((input) => {
    const item = ui.cart.find((entry) => entry.flowerId === input.dataset.id);
    const flower = getFlower(input.dataset.id);
    if (!item || !flower) return;
    item.qty = clamp(Math.round(parseNumber(input.value, 1)), 1, flower.stock);
  });
  document.querySelectorAll('[data-cart-price]').forEach((input) => {
    const item = ui.cart.find((entry) => entry.flowerId === input.dataset.id);
    if (!item) return;
    item.unitPrice = round2(Math.max(0, parseNumber(input.value, item.unitPrice)));
  });
}

function checkoutSummaryMarkup(summary) {
  return `<div class="summary-line"><span>商品件数</span><strong>${number(summary.count)} 件</strong></div>
    <div class="summary-line"><span>预估成本</span><strong>${money(summary.cost)}</strong></div>
    <div class="summary-line"><span>预估毛利</span><strong>${money(summary.profit)}</strong></div>
    <div class="summary-line total"><span>应收合计</span><strong>${money(summary.subtotal)}</strong></div>`;
}

function refreshCheckoutTotals() {
  const summary = cartSummary();
  const countEl = document.querySelector('.checkout-count');
  if (countEl) countEl.textContent = String(summary.count);
  const summaryEl = document.querySelector('.checkout-summary');
  if (summaryEl) summaryEl.innerHTML = checkoutSummaryMarkup(summary);
  document.querySelectorAll('[data-line-total]').forEach((el) => {
    const item = summary.details.find((detail) => detail.flower.id === el.dataset.lineTotal);
    if (item) el.innerHTML = `${money(item.subtotal)}<small>小计</small>`;
  });
  const submit = document.getElementById('saleSubmitBtn');
  if (submit) {
    submit.disabled = !summary.details.length;
    submit.innerHTML = `${icon('check-circle', 17)} 完成收款 · ${money(summary.subtotal)}`;
  }
}

/* ---------------- 弹窗 ---------------- */
function openModal({ title, subtitle = '', body = '', footer = '', size = '' }) {
  const layer = document.getElementById('modalLayer');
  const modal = document.getElementById('modal');
  if (!layer || !modal) return;
  lastFocused = document.activeElement;
  modal.className = `modal ${size === 'wide' ? 'is-wide' : size === 'large' ? 'is-large' : ''}`;
  modal.innerHTML = `<div class="modal-head">
      <h2 id="modalTitle">${title}</h2>
      ${subtitle ? `<p>${subtitle}</p>` : ''}
      <button class="modal-close" data-action="close-modal" aria-label="关闭弹窗" title="关闭">${icon('x', 14)}</button>
    </div>
    <div class="modal-body">${body}</div>
    ${footer ? `<div class="modal-foot">${footer}</div>` : ''}`;
  layer.hidden = false;
  document.body.classList.add('modal-open');
  window.setTimeout(() => {
    const focusTarget = modal.querySelector('[data-autofocus]') ||
      modal.querySelector('input:not([type="hidden"]):not([type="file"]), select, textarea');
    if (focusTarget) focusTarget.focus();
  }, 45);
}

function closeModal() {
  const layer = document.getElementById('modalLayer');
  const modal = document.getElementById('modal');
  if (!layer || layer.hidden) return;
  layer.hidden = true;
  if (modal) modal.innerHTML = '';
  document.body.classList.remove('modal-open');
  pendingConfirm = null;
  if (lastFocused && document.contains(lastFocused)) {
    try { lastFocused.focus({ preventScroll: true }); } catch (_) { /* noop */ }
  }
  lastFocused = null;
}

function setFormError(form, message) {
  const el = form.querySelector('.form-error');
  if (!el) {
    showToast(message, 'error');
    return;
  }
  el.textContent = message;
  el.classList.add('is-visible');
  el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

function clearFormError(form) {
  const el = form.querySelector('.form-error');
  if (el) {
    el.textContent = '';
    el.classList.remove('is-visible');
  }
}

function openConfirmModal({ title, message, confirmText = '确认', onConfirm, danger = true }) {
  pendingConfirm = onConfirm;
  openModal({
    title,
    subtitle: '这个操作会立即生效',
    body: `<div class="confirm-message">${message}</div>`,
    footer: `<button class="btn btn-ghost" data-action="close-modal" type="button">取消</button>
      <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-action="confirm-pending" type="button">${escapeHTML(confirmText)}</button>`
  });
}

/* ---------------- 花卉表单 ---------------- */
function optionList(values, selected) {
  return values.map((value) => `<option value="${escapeHTML(value)}" ${String(value) === String(selected) ? 'selected' : ''}>${escapeHTML(value)}</option>`).join('');
}

function uniqueValues(values) {
  return Array.from(new Set(values.filter(Boolean)));
}

function openFlowerModal(id = null) {
  const flower = id ? getFlower(id) : null;
  if (id && !flower) {
    showToast('没有找到这枝花。', 'error');
    return;
  }
  const editing = Boolean(flower);
  const categoryValues = uniqueValues([...CATEGORIES, flower?.category]);
  const colorValues = uniqueValues([...COLORS, flower?.color]);
  const unitValues = uniqueValues([...UNITS, flower?.unit]);
  const suppliers = uniqueValues(state.flowers.map((f) => f.supplier));
  const title = editing ? '编辑花卉资料' : '新增花卉';
  const subtitle = editing ? '修改基础资料、售价或成本；库存数量请通过“调整库存”变更。' : '录入花材信息、成本与售价，建立第一笔库存。';

  const body = `<form id="flowerForm" class="modal-form" novalidate>
    <input type="hidden" name="id" value="${editing ? escapeHTML(flower.id) : ''}">
    <div class="form-error"></div>
    <div class="form-grid">
      <div class="form-section-title">基本信息</div>
      <div class="field half">
        <label for="flowerName">花卉名称 <span class="req">*</span></label>
        <input id="flowerName" name="name" type="text" value="${editing ? escapeHTML(flower.name) : ''}" placeholder="例如：自由精神玫瑰" maxlength="40" required data-autofocus>
      </div>
      <div class="field half">
        <label for="flowerVariety">品种 / 别名</label>
        <input id="flowerVariety" name="variety" type="text" value="${editing ? escapeHTML(flower.variety) : ''}" placeholder="例如：自由精神" maxlength="30">
      </div>
      <div class="field half">
        <label for="flowerCategory">品类</label>
        <select id="flowerCategory" name="category">${optionList(categoryValues, editing ? flower.category : '玫瑰')}</select>
      </div>
      <div class="field half">
        <label for="flowerColor">颜色</label>
        <select id="flowerColor" name="color">${optionList(colorValues, editing ? flower.color : '粉色')}</select>
      </div>
      <div class="field half">
        <label for="flowerGrade">等级</label>
        <select id="flowerGrade" name="grade">${optionList(uniqueValues([...GRADES, flower?.grade]), editing ? flower.grade : 'A')}</select>
      </div>
      <div class="field half">
        <label for="flowerUnit">计量单位</label>
        <select id="flowerUnit" name="unit">${optionList(unitValues, editing ? flower.unit : '枝')}</select>
      </div>
      <div class="field half">
        <label for="flowerSupplier">供应商</label>
        <input id="flowerSupplier" name="supplier" type="text" list="supplierList" value="${editing ? escapeHTML(flower.supplier) : ''}" placeholder="例如：云岭花材" maxlength="40">
        <datalist id="supplierList">${suppliers.map((s) => `<option value="${escapeHTML(s)}"></option>`).join('')}</datalist>
      </div>
      <div class="field half">
        <label for="flowerLocation">存放位置</label>
        <input id="flowerLocation" name="location" type="text" value="${editing ? escapeHTML(flower.location) : ''}" placeholder="例如：冷藏柜 A1" maxlength="30">
      </div>

      <div class="form-section-title">价格与库存</div>
      <div class="field half">
        <label for="flowerCost">进货成本（元）</label>
        <div class="input-affix"><span>¥</span><input id="flowerCost" name="cost" type="number" min="0" step="0.01" value="${editing ? flower.cost : ''}" placeholder="0.00" inputmode="decimal"></div>
      </div>
      <div class="field half">
        <label for="flowerPrice">销售单价（元）<span class="req">*</span></label>
        <div class="input-affix"><span>¥</span><input id="flowerPrice" name="price" type="number" min="0.01" step="0.01" value="${editing ? flower.price : ''}" placeholder="0.00" inputmode="decimal" required></div>
      </div>
      ${editing ? '' : `<div class="field half">
        <label for="flowerStock">初始库存</label>
        <input id="flowerStock" name="stock" type="number" min="0" step="1" value="" placeholder="0" inputmode="numeric">
      </div>`}
      <div class="field half">
        <label for="flowerMinStock">安全库存</label>
        <input id="flowerMinStock" name="minStock" type="number" min="0" step="1" value="${editing ? flower.minStock : '10'}" inputmode="numeric">
        <span class="hint">低于该数量时提醒补货</span>
      </div>
      <div class="field full">
        <label for="flowerNote">备注</label>
        <textarea id="flowerNote" name="note" rows="3" maxlength="200" placeholder="花期、养护、搭配建议等">${editing ? escapeHTML(flower.note) : ''}</textarea>
      </div>
      <div class="margin-preview full" id="flowerMarginPreview">
        <span>预计毛利率</span><strong>—</strong>
      </div>
      ${editing ? '<div class="form-note full">库存数量请使用“调整库存”中的补货、报损或盘点修正，以保留库存流水。</div>' : '<div class="form-note full">初始库存会生成一条“期初入库”流水；之后可用补货、报损或盘点修正来维护。</div>'}
    </div>
  </form>`;

  openModal({
    title,
    subtitle,
    body,
    footer: `<span class="foot-note">${editing ? '修改价格与成本会写入调价记录' : '数据保存在当前浏览器本地'}</span>
      <button class="btn btn-ghost" data-action="close-modal" type="button">取消</button>
      <button class="btn btn-primary" type="submit" form="flowerForm">${editing ? '保存修改' : '保存花卉'}</button>`
  });
  updateFlowerMarginPreview();
}

function updateFlowerMarginPreview() {
  const costEl = document.getElementById('flowerCost');
  const priceEl = document.getElementById('flowerPrice');
  const preview = document.getElementById('flowerMarginPreview');
  if (!costEl || !priceEl || !preview) return;
  const cost = Math.max(0, parseNumber(costEl.value));
  const price = Math.max(0, parseNumber(priceEl.value));
  const margin = grossMargin(price, cost);
  preview.innerHTML = `<span>预计毛利率</span><strong style="color:${margin < 0.2 ? 'var(--red)' : margin < 0.35 ? '#9b722e' : 'var(--green)'}">${price > 0 ? percent(margin, 1) : '—'}</strong>`;
}

function handleFlowerSubmit(form) {
  clearFormError(form);
  const fd = new FormData(form);
  const id = String(fd.get('id') || '');
  const name = String(fd.get('name') || '').trim();
  const price = round2(parseNumber(fd.get('price')));
  const cost = round2(parseNumber(fd.get('cost')));
  const minStock = Math.max(0, Math.round(parseNumber(fd.get('minStock'))));
  const stock = Math.max(0, Math.round(parseNumber(fd.get('stock'))));
  const category = String(fd.get('category') || '其他');
  const color = String(fd.get('color') || '');
  const variety = String(fd.get('variety') || '').trim();
  const grade = String(fd.get('grade') || 'A');
  const unit = String(fd.get('unit') || '枝');
  const supplier = String(fd.get('supplier') || '').trim();
  const location = String(fd.get('location') || '').trim();
  const note = String(fd.get('note') || '').trim();

  if (!name) {
    setFormError(form, '请填写花卉名称。');
    return;
  }
  if (price <= 0) {
    setFormError(form, '销售单价必须大于 0。');
    return;
  }
  if (cost < 0) {
    setFormError(form, '进货成本不能为负数。');
    return;
  }

  if (id) {
    const flower = getFlower(id);
    if (!flower) {
      setFormError(form, '找不到这枝花，请刷新页面重试。');
      return;
    }
    const oldPrice = flower.price;
    const oldCost = flower.cost;
    Object.assign(flower, {
      name, variety, category, color, grade, unit, price, cost,
      minStock, supplier, location, note
    });
    if (Math.abs(oldPrice - price) > 0.001 || Math.abs(oldCost - cost) > 0.001) {
      state.priceHistory.push({
        id: uid('ph'),
        flowerId: flower.id,
        date: new Date().toISOString(),
        oldPrice,
        newPrice: price,
        oldCost,
        newCost: cost,
        reason: '编辑资料更新价格 / 成本'
      });
    }
    closeModal();
    commit();
    showToast(`${name} 的资料已更新。`);
    return;
  }

  const flower = {
    id: uid('f'),
    name,
    variety,
    category,
    color,
    grade,
    unit,
    cost,
    price,
    stock,
    minStock,
    supplier,
    location,
    note,
    createdAt: new Date().toISOString(),
    restockedAt: new Date().toISOString(),
    active: true
  };
  state.flowers.unshift(flower);
  if (stock > 0) {
    state.movements.unshift({
      id: uid('m'),
      flowerId: flower.id,
      type: 'initial',
      change: stock,
      before: 0,
      after: stock,
      unitCost: cost,
      note: '新增花卉，期初入库',
      date: new Date().toISOString(),
      orderId: null
    });
  }
  closeModal();
  commit();
  showToast(`${name} 已加入花卉库。`);
}

    </div>

    <div class="adjust-mode-panel" data-mode="loss" hidden>
      <div class="form-grid">
        <div class="field half">
          <label for="lossQty">损耗数量（${escapeHTML(flower.unit)}）</label>
          <input id="lossQty" name="lossQty" type="number" min="1" step="1" value="1" inputmode="numeric">

        </div>

      <button class="btn btn-primary" type="submit" form="adjustForm" id="adjustSubmit">确认入库</button>`
  });

}

function syncAdjustForm(form) {
  if (!form) return;
  const checked = form.querySelector('input[name="adjustType"]:checked');
  const mode = checked ? checked.value : 'in';
  form.querySelectorAll('.adjust-mode-panel').forEach((panel) => {
    panel.hidden = panel.dataset.mode !== mode;
  });
  const submit = document.getElementById('adjustSubmit');
  if (submit) {
    submit.textContent = mode === 'in' ? '确认入库' : mode === 'loss' ? '确认报损' : '确认盘点';
  }
  const qty = form.querySelector('[data-mode="in"] [data-autofocus]');
  if (mode === 'in' && qty && document.activeElement && !form.contains(document.activeElement)) {
    qty.focus();
  }
}

function handleAdjustSubmit(form) {
  clearFormError(form);
  const fd = new FormData(form);
  const id = String(fd.get('flowerId') || '');
  const flower = getFlower(id);
  const mode = String(fd.get('adjustType') || 'in');
  const note = String(fd.get('note') || '').trim();
  if (!flower) {
    setFormError(form, '找不到这枝花，请刷新后重试。');
    return;
  }

  if (mode === 'in') {
    const qty = Math.round(parseNumber(fd.get('inQty')));
    const unitCost = round2(parseNumber(fd.get('inUnitCost')));
    if (qty <= 0) {
      setFormError(form, '入库数量需要大于 0。');
      return;
    }
    if (unitCost < 0) {
      setFormError(form, '进货单价不能为负数。');
      return;
    }
    const before = flower.stock;
    const after = before + qty;
    const oldCost = flower.cost;
    const newCost = round2(((before * oldCost) + (qty * unitCost)) / Math.max(1, after));
    flower.stock = after;
    flower.cost = newCost;
    flower.restockedAt = new Date().toISOString();
    state.movements.unshift({
      id: uid('m'),
      flowerId: flower.id,
      type: 'in',
      change: qty,
      before,
      after,
      unitCost,
      note: note || '补货入库',
      date: new Date().toISOString(),
      orderId: null
    });
    if (Math.abs(oldCost - newCost) > 0.001) {
      state.priceHistory.push({
        id: uid('ph'),
        flowerId: flower.id,
        date: new Date().toISOString(),
        oldPrice: flower.price,
        newPrice: flower.price,
        oldCost,
        newCost,
        reason: note ? `补货更新成本 · ${note}` : '补货更新成本（加权平均）'
      });
    }
    closeModal();
    commit();
    showToast(`${flower.name} 已入库 ${number(qty)} ${flower.unit}，库存更新为 ${number(after)}。`);
    return;
  }

  if (mode === 'loss') {
    const qty = Math.round(parseNumber(fd.get('lossQty')));
    const reason = String(fd.get('lossReason') || '其他损耗');
    if (qty <= 0) {
      setFormError(form, '损耗数量需要大于 0。');
      return;
    }
    if (qty > flower.stock) {
      setFormError(form, `损耗数量不能超过当前库存（${flower.stock} ${flower.unit}）。`);
      return;
    }
    const before = flower.stock;
    const after = before - qty;
    flower.stock = after;
    state.movements.unshift({
      id: uid('m'),
      flowerId: flower.id,
      type: 'loss',
      change: -qty,
      before,
      after,
      unitCost: flower.cost,
      note: note ? `${reason} · ${note}` : reason,
      date: new Date().toISOString(),
      orderId: null
    });
    closeModal();
    commit();
    showToast(`${flower.name} 已报损 ${number(qty)} ${flower.unit}，损耗成本 ${money(qty * flower.cost)}。`, 'info');
    return;
  }

  const actual = Math.round(parseNumber(fd.get('actualStock'), flower.stock));
  if (actual < 0) {
    setFormError(form, '实际库存不能为负数。');
    return;
  }
  const before = flower.stock;
  const diff = actual - before;
  if (diff === 0) {
    setFormError(form, '盘点数量与当前库存一致，无需调整。');
    return;
  }
  flower.stock = actual;
  state.movements.unshift({
    id: uid('m'),
    flowerId: flower.id,
    type: diff < 0 ? 'loss' : 'count',
    change: diff,
    before,
    after: actual,
    unitCost: diff < 0 ? flower.cost : 0,
    note: diff < 0
      ? `盘点盘亏${note ? ` · ${note}` : ''}`
      : `盘点盘盈${note ? ` · ${note}` : ''}`,
    date: new Date().toISOString(),
    orderId: null
  });
  closeModal();
  commit();
  showToast(`盘点完成：${flower.name} 库存由 ${number(before)} 调整为 ${number(actual)} ${flower.unit}。`);
}

function updatePriceMarginPreview() {
  const costEl = document.getElementById('priceNewCost');
  const priceEl = document.getElementById('priceNewPrice');
  const preview = document.getElementById('priceMarginPreview');
  if (!costEl || !priceEl || !preview) return;
  const cost = Math.max(0, parseNumber(costEl.value));
  const price = Math.max(0, parseNumber(priceEl.value));
  const margin = grossMargin(price, cost);
  preview.innerHTML = `<span>调整后毛利率</span><strong style="color:${margin < 0.2 ? 'var(--red)' : margin < 0.35 ? '#9b722e' : 'var(--green)'}">${price > 0 ? percent(margin, 1) : '—'}</strong>`;
}

function handlePriceSubmit(form) {
  clearFormError(form);
  const fd = new FormData(form);
  const flower = getFlower(String(fd.get('flowerId') || ''));
  if (!flower) {
    setFormError(form, '找不到这枝花，请刷新后重试。');
    return;
  }
  const newPrice = round2(parseNumber(fd.get('price')));
  const newCost = round2(parseNumber(fd.get('cost')));
  const reason = String(fd.get('reason') || '').trim() || '调整价格';
  if (newPrice <= 0) {
    setFormError(form, '销售单价必须大于 0。');
    return;
  }
  if (newCost < 0) {
    setFormError(form, '单位成本不能为负数。');
    return;
  }
  if (Math.abs(newPrice - flower.price) < 0.001 && Math.abs(newCost - flower.cost) < 0.001) {
    setFormError(form, '售价和成本都没有变化，无需保存。');
    return;
  }
  const oldPrice = flower.price;
  const oldCost = flower.cost;
  flower.price = newPrice;
  flower.cost = newCost;
  state.priceHistory.push({
    id: uid('ph'),
    flowerId: flower.id,
    date: new Date().toISOString(),
    oldPrice,
    newPrice,
    oldCost,
    newCost,
    reason
  });
  closeModal();
  commit();
  showToast(`${flower.name} 售价已由 ${money(oldPrice)} 调整为 ${money(newPrice)}。`);
}

/* ---------------- 销售与订单 ---------------- */
function handleSaleSubmit(form) {
  clearFormError(form);
  syncCartFromInputs();
  const summary = cartSummary();
  const fd = new FormData(form);
  const customer = String(fd.get('customer') || '').trim() || '散客';
  const payment = String(fd.get('payment') || '微信');
  const dateRaw = String(fd.get('date') || dateInputValue());
  const note = String(fd.get('note') || '').trim();

  if (!summary.details.length) {
    setFormError(form, '清单为空，请先选择花卉。');
    return;
  }
  if (!dateRaw) {
    setFormError(form, '请选择开单日期。');
    return;
  }
  for (const item of summary.details) {
    const flower = getFlower(item.flower.id);
    if (!flower || flower.active === false) {
      setFormError(form, `${item.flower.name} 已下架，请从清单中移除。`);
      return;
    }
    if (item.qty > flower.stock) {
      setFormError(form, `${flower.name} 库存不足，当前仅剩 ${flower.stock} ${flower.unit}。`);
      return;
    }
    if (item.unitPrice <= 0) {
      setFormError(form, `${flower.name} 的单价需要大于 0。`);
      return;
    }
  }

  const selected = new Date(`${dateRaw}T12:00:00`);
  if (Number.isNaN(selected.getTime())) {
    setFormError(form, '开单日期格式不正确。');
    return;
  }
  const orderDate = localDateKey(selected) === localDateKey(new Date()) ? new Date() : selected;
  const lines = summary.details.map((item) => ({
    flowerId: item.flower.id,
    name: item.flower.name,
    variety: item.flower.variety,
    unit: item.flower.unit,
    qty: item.qty,
    unitPrice: item.unitPrice,
    cost: item.flower.cost,
    subtotal: round2(item.qty * item.unitPrice)
  }));
  const total = round2(lines.reduce((sum, line) => sum + line.subtotal, 0));
  const cost = round2(lines.reduce((sum, line) => sum + line.cost * line.qty, 0));
  const order = {
    id: uid('o'),
    no: nextOrderNo(orderDate),
    date: orderDate.toISOString(),
    customer,
    payment,
    note,
    lines,
    total,
    cost,
    profit: round2(total - cost),
    status: 'completed',
    refundedAt: null
  };

  summary.details.forEach((item) => {
    const flower = getFlower(item.flower.id);
    const before = flower.stock;
    flower.stock = before - item.qty;
    state.movements.unshift({
      id: uid('m'),
      flowerId: flower.id,
      type: 'sale',
      change: -item.qty,
      before,
      after: flower.stock,
      unitCost: flower.cost,
      note: `销售出库 · ${order.no}`,
      date: order.date,
      orderId: order.id
    });
  });

  state.orders.unshift(order);
  ui.cart = [];
  saveState(state);
  updateSaveIndicator({ ok: true, at: new Date() });
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
  openOrderDetail(order.id, { success: true });
  showToast(`订单 ${order.no} 已完成收款。`);
}

      <strong>${escapeHTML(line.name)}${line.variety ? `<span class="flower-meta" style="font-weight:400">${escapeHTML(line.variety)}</span>` : ''}</strong>

  const body = `${success ? `<div class="success-banner">${icon('check-circle', 17)} 收款完成，库存已自动扣减。可以继续开下一单，或查看本次销售凭证。</div>` : ''}

      <div class="receipt-total-row"><span>毛利</span><strong>${money(orderGrossProfit(order))}</strong></div>
      <div class="receipt-total-row grand"><span>实收合计</span><strong>${money(orderRevenue(order))}</strong></div>

      <div class="detail-box"><span>收款方式</span><strong style="font-family:var(--sans);font-size:11px">${escapeHTML(order.payment)}</strong></div>
      <div class="detail-box is-wide" style="grid-column:1/-1"><span>备注</span><strong style="font-family:var(--sans);font-size:11px">${escapeHTML(order.note || '无')}</strong></div>
      ${refunded ? `<div class="detail-box is-wide" style="grid-column:1/-1"><span>退款时间</span><strong style="font-family:var(--sans);font-size:11px">${order.refundedAt ? formatDateTime(order.refundedAt) : '—'}</strong></div>` : ''}
    </div>`;

  const footer = success
    ? `<button class="btn btn-ghost" data-action="nav" data-view="sales" type="button">继续开单</button>
       <button class="btn btn-primary" data-action="nav" data-view="records" type="button">查看销售记录</button>`
    : `<button class="btn btn-ghost" data-action="close-modal" type="button">关闭</button>
       ${refunded ? '' : `<button class="btn btn-danger" data-action="refund-order" data-id="${order.id}" type="button">整单退款</button>`}`;

  openModal({
    title: success ? '收款成功' : '订单详情',
    subtitle: success ? '本次销售已完成，库存和经营数据已同步更新。' : '销售凭证与退款入口',
    body,
    footer,
    size: 'wide'
  });
}

function confirmRefundOrder(id) {
  const order = state.orders.find((o) => o.id === id);
  if (!order || order.status === 'refunded') return;
  openConfirmModal({
    title: '确认整单退款？',
    message: `<p class="confirm-message">确定要为订单 <strong>${escapeHTML(order.no)}</strong>（${money(orderRevenue(order))}）办理退款吗？</p>
      <p class="confirm-note">退款后商品库存会自动恢复，该订单将从营收、毛利和销售分析中剔除。此操作不可撤销。</p>`,
    confirmText: '确认退款',
    danger: true,
    onConfirm: () => {
      const refundDate = new Date().toISOString();
      order.lines.forEach((line) => {
        const flower = getFlower(line.flowerId);
        if (flower) {
          const before = flower.stock;
          flower.stock += line.qty;
          state.movements.unshift({
            id: uid('m'),
            flowerId: flower.id,
            type: 'refund',
            change: line.qty,
            before,
            after: flower.stock,
            unitCost: line.cost,
            note: `退款入库 · ${order.no}`,
            date: refundDate,
            orderId: order.id
          });
        }
      });
      order.status = 'refunded';
      order.refundedAt = refundDate;
      commit();
      showToast(`订单 ${order.no} 已退款，库存已恢复。`, 'info');
    }
  });
}

/* ---------------- 导入 / 导出 ---------------- */
function downloadFile(filename, content, mime = 'text/plain;charset=utf-8') {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  window.setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function csvCell(value) {
  let text = String(value ?? '').replace(/\r?\n/g, ' ');
  if (/^[=+\-@]/.test(text)) text = `'${text}`;
  return `"${text.replace(/"/g, '""')}"`;
}

function exportJSON() {
  const payload = Object.assign({}, state, {
    exportedAt: new Date().toISOString(),
    app: '花间集 · 花卉经营工作台'
  });
  downloadFile(`花间集备份_${localDateKey(new Date()).replace(/-/g, '')}.json`, JSON.stringify(payload, null, 2), 'application/json;charset=utf-8');
  showToast('完整数据备份已导出。');
}

function exportOrdersCSV() {
  const orders = filteredOrders();
  const header = ['订单号', '日期', '客户', '商品明细', '数量', '实收金额', '商品成本', '毛利', '收款方式', '状态', '备注'];
  const rows = orders.map((order) => [
    order.no,
    formatDateTime(order.date),
    order.customer,
    order.lines.map((line) => `${line.name}×${line.qty}${line.unit}`).join('；'),
    orderUnitCount(order),
    orderRevenue(order).toFixed(2),
    orderCost(order).toFixed(2),
    orderGrossProfit(order).toFixed(2),
    order.payment,
    order.status === 'refunded' ? '已退款' : '已完成',
    order.note
  ]);
  const csv = [header, ...rows].map((row) => row.map(csvCell).join(',')).join('\r\n');
  downloadFile(`销售明细_${localDateKey(new Date()).replace(/-/g, '')}.csv`, `\uFEFF${csv}`, 'text/csv;charset=utf-8');
  showToast(`已导出 ${orders.length} 笔销售记录。`);
}

function exportInventoryCSV() {
  const list = filteredFlowers();
  const header = ['花卉', '品类', '品种', '颜色', '等级', '单位', '剩余数量', '安全库存', '单位成本', '销售单价', '毛利率', '库存成本', '供应商', '存放位置', '库龄(天)'];
  const rows = list.map((f) => [
    f.name,
    f.category,
    f.variety,
    f.color,
    f.grade,
    f.unit,
    f.stock,
    f.minStock,
    f.cost.toFixed(2),
    f.price.toFixed(2),
    percent(grossMargin(f.price, f.cost), 1),
    (f.stock * f.cost).toFixed(2),
    f.supplier,
    f.location,
    shelfDays(f)
  ]);
  const csv = [header, ...rows].map((row) => row.map(csvCell).join(',')).join('\r\n');
  downloadFile(`花卉库存_${localDateKey(new Date()).replace(/-/g, '')}.csv`, `\uFEFF${csv}`, 'text/csv;charset=utf-8');
  showToast(`已导出 ${list.length} 种花卉库存。`);
}

async function importJSONFile(file) {
  if (!file) return;
  try {
    const text = await file.text();
    const parsed = JSON.parse(text);
    const normalized = normalizeState(parsed);
    if (!normalized) throw new Error('备份文件缺少花卉或订单数据');
    state = normalized;
    ui.cart = [];
    ui.priceFlowerId = null;
    saveState(state);
    updateSaveIndicator({ ok: true, at: new Date() });
    closeModal();
    render();
    showToast('备份已导入，数据恢复完成。');
  } catch (error) {
    console.warn(error);
    showToast(`导入失败：${error.message || '文件格式不正确'}`, 'error');
  }
}

/* ---------------- 事件 ---------------- */
function bindEvents() {
  document.addEventListener('click', handleClick);
  document.addEventListener('submit', handleSubmit);
  document.addEventListener('input', handleInput);
  document.addEventListener('change', handleChange);
  document.addEventListener('keydown', handleKeydown);
}

function handleClick(event) {
  const target = event.target.closest('[data-action]');
  if (!target) return;
  const action = target.dataset.action;
  if (!action) return;
  if (target.tagName === 'A') event.preventDefault();

  switch (action) {
    case 'toggle-sidebar':
      document.getElementById('sidebar')?.classList.contains('is-open') ? closeSidebar() : openSidebar();
      break;
    case 'close-sidebar':
      closeSidebar();
      break;
    case 'nav':
      navigate(target.dataset.view);
      break;
    case 'goto-inventory':
      ui.invStatus = target.dataset.filter || 'all';
      ui.invSearch = '';
      ui.invCategory = 'all';
      navigate('inventory');
      break;
    case 'open-add-flower':
      openFlowerModal();
      break;
    case 'edit-flower':
      openFlowerModal(target.dataset.id);
      break;
    case 'view-flower':
      openFlowerDetail(target.dataset.id);
      break;
    case 'adjust-stock':
      openAdjustModal(target.dataset.id);
      break;
    case 'change-price':
      openPriceModal(target.dataset.id);
      break;
    case 'quick-sale':
      addToCart(target.dataset.id);
      break;
    case 'add-to-cart':
      addToCart(target.dataset.id);
      break;
    case 'remove-cart':
      removeCartItem(target.dataset.id);
      break;
    case 'cart-inc':
      changeCartQty(target.dataset.id, 1);
      break;
    case 'cart-dec':
      changeCartQty(target.dataset.id, -1);
      break;
    case 'scroll-checkout':
      document.getElementById('checkoutCard')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      break;
    case 'view-order':
      openOrderDetail(target.dataset.id);
      break;
    case 'refund-order':
      confirmRefundOrder(target.dataset.id);
      break;
    case 'delete-flower': {
      const flower = getFlower(target.dataset.id);
      if (!flower) break;
      openConfirmModal({
        title: '删除这枝花？',
        message: `<p class="confirm-message">确定要删除 <strong>${escapeHTML(flower.name)}</strong> 吗？</p><p class="confirm-note">当前库存、库存流水和调价记录会一起移除；历史销售订单仍会保留，但无法再从花名查看档案。</p>`,
        confirmText: '删除花卉',
        danger: true,
        onConfirm: () => {
          state.flowers = state.flowers.filter((f) => f.id !== flower.id);
          state.movements = state.movements.filter((m) => m.flowerId !== flower.id);
          state.priceHistory = state.priceHistory.filter((p) => p.flowerId !== flower.id);
          ui.cart = ui.cart.filter((item) => item.flowerId !== flower.id);
          if (ui.priceFlowerId === flower.id) ui.priceFlowerId = null;
          commit();
          showToast(`${flower.name} 已删除。`, 'info');
        }
      });
      break;
    }
    case 'close-modal':
      closeModal();
      break;
    case 'confirm-pending': {
      const fn = pendingConfirm;
      pendingConfirm = null;
      closeModal();
      if (typeof fn === 'function') fn();
      break;
    }
    case 'open-settings':
      openSettingsModal();
      break;
    case 'export-json':
      exportJSON();
      break;
    case 'export-orders-csv':
      exportOrdersCSV();
      break;
    case 'export-inventory-csv':
      exportInventoryCSV();
      break;
    case 'import-json':
      document.getElementById('importFile')?.click();
      break;
    case 'reset-demo':
      resetDemoData();
      break;
    case 'clear-data':
      clearAllData();
      break;
    case 'clear-search':
      clearSearch(target.dataset.target);
      break;
    case 'reset-inventory-filters':
      ui.invSearch = '';
      ui.invCategory = 'all';
      ui.invStatus = 'all';
      ui.invSort = 'default';
      render();
      break;
    case 'set-chart-range':
      ui.chartRange = Number(target.dataset.value) === 30 ? 30 : 7;
      render();
      break;
    case 'set-finance-range':
      ui.financeRange = target.dataset.value || '30';
      render();
      break;
    default:
      console.warn('未处理的操作', action);
  }
}

function clearSearch(target) {
  if (target === 'inventory') {
    ui.invSearch = '';
    render();
  } else if (target === 'sale') {
    ui.saleSearch = '';
    render();
  } else if (target === 'records') {
    ui.recordSearch = '';
    render();
  }
}

function handleSubmit(event) {
  const form = event.target;
  if (!form) return;
  const formId = form.getAttribute('id') || '';
  const handled = ['flowerForm', 'adjustForm', 'priceForm', 'saleForm', 'settingsForm'];
  if (!handled.includes(formId)) return;
  event.preventDefault();
  if (formId === 'flowerForm') handleFlowerSubmit(form);
  else if (formId === 'adjustForm') handleAdjustSubmit(form);
  else if (formId === 'priceForm') handlePriceSubmit(form);
  else if (formId === 'saleForm') handleSaleSubmit(form);
  else if (formId === 'settingsForm') handleSettingsSubmit(form);
}

function handleInput(event) {
  const target = event.target;
  if (target.id === 'invSearch') {
    ui.invSearch = target.value;
    refreshInventoryTable();
    return;
  }
  if (target.id === 'saleSearch') {
    ui.saleSearch = target.value;
    refreshSaleProducts();
    return;
  }
  if (target.id === 'recordSearch') {
    ui.recordSearch = target.value;
    refreshRecordsTable();
    return;
  }
  if (target.id === 'flowerCost' || target.id === 'flowerPrice') {
    updateFlowerMarginPreview();
    return;
  }
  if (target.id === 'priceNewCost' || target.id === 'priceNewPrice') {
    updatePriceMarginPreview();
    return;
  }
  if (target.matches('[data-cart-qty]')) {
    const flower = getFlower(target.dataset.id);
    const item = ui.cart.find((entry) => entry.flowerId === target.dataset.id);
    if (!flower || !item) return;
    item.qty = clamp(Math.round(parseNumber(target.value, 1)), 1, flower.stock);
    refreshCheckoutTotals();
    return;
  }
  if (target.matches('[data-cart-price]')) {
    const item = ui.cart.find((entry) => entry.flowerId === target.dataset.id);
    if (!item) return;
    item.unitPrice = round2(Math.max(0, parseNumber(target.value, item.unitPrice)));
    refreshCheckoutTotals();
  }
}

function handleChange(event) {
  const target = event.target;
  if (target.id === 'invCategory') {
    ui.invCategory = target.value;
    render();
    return;
  }
  if (target.id === 'invStatus') {
    ui.invStatus = target.value;
    render();
    return;
  }
  if (target.id === 'invSort') {
    ui.invSort = target.value;
    render();
    return;
  }
  if (target.id === 'saleCategory') {
    ui.saleCategory = target.value;
    render();
    return;
  }
  if (target.id === 'recordRange') {
    ui.recordRange = target.value;
    render();
    return;
  }
  if (target.id === 'recordPayment') {
    ui.recordPayment = target.value;
    render();
    return;
  }
  if (target.id === 'priceFlowerSelect') {
    ui.priceFlowerId = target.value;
    render();
    return;
  }
  if (target.name === 'adjustType') {
    syncAdjustForm(target.closest('form'));
    return;
  }
  if (target.matches('[data-cart-qty]')) {
    const flower = getFlower(target.dataset.id);
    const item = ui.cart.find((entry) => entry.flowerId === target.dataset.id);
    if (!flower || !item) return;
    item.qty = clamp(Math.round(parseNumber(target.value, 1)), 1, flower.stock);
    target.value = item.qty;
    refreshCheckoutTotals();
    return;
  }
  if (target.matches('[data-cart-price]')) {
    const item = ui.cart.find((entry) => entry.flowerId === target.dataset.id);
    if (!item) return;
    item.unitPrice = round2(Math.max(0, parseNumber(target.value, item.unitPrice)));
    target.value = item.unitPrice.toFixed(2);
    refreshCheckoutTotals();
    return;
  }
  if (target.id === 'importFile') {
    const file = target.files && target.files[0];
    target.value = '';
    importJSONFile(file);
  }
}

function handleKeydown(event) {
  if (event.key === 'Escape') {
    const layer = document.getElementById('modalLayer');
    if (layer && !layer.hidden) {
      closeModal();
      return;
    }
    closeSidebar();
  }
  if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k') {
    event.preventDefault();
    if (ui.view !== 'inventory') navigate('inventory');
    window.setTimeout(() => document.getElementById('invSearch')?.focus(), 80);
  }
}

/* ---------------- 启动 ---------------- */
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

</script>
</body>
</html>
