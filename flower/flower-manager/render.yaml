services:
  - type: web
    name: huajian-flower-os
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      # 可选：生产环境模型配置
      # - key: LLM_ENDPOINT
      #   value: https://api.deepseek.com/chat/completions
      # - key: LLM_MODEL
      #   value: deepseek-chat
      # - key: LLM_API_KEY
      #   sync: false
